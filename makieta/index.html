<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZANT — makieta</title><link rel="stylesheet" href="base.css"></head><body>
<div class="top"><div class="row"><b>ZANT</b><div class="seg"><button id="r1" class="on" onclick="role(1)">Przedsiębiorca</button><button id="r2" onclick="role(2)">Pracownik ZUS</button></div></div><div class="loc">Bez zewnętrznego modelu AI — przetwarzanie na serwerze aplikacji</div></div>
<div class="wrap" id="app"></div>
<div class="modal" id="m"><div class="box"><h2>Brakuje jeszcze</h2><ul id="ml"></ul><p class="sm mut">Możesz wysłać teraz — przekażemy tę listę pracownikowi ZUS.</p><button class="btn sec" onclick="$('#m').classList.remove('on')">Wróć i uzupełnij</button><div style="height:8px"></div><button class="btn" onclick="$('#m').classList.remove('on');go(4)">Wysyłam mimo braków</button></div></div>
<div class="demo">Makieta — dane udawane (zbiór sztuczny). Układ: wariant 1 (przedsiębiorca), elementy wariantu 3 (ZUS).</div>
<script src="dane.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const D=window.DANE,cs=id=>D.cases.find(c=>c.id===id);
const S={ok:['d-ok','spełniona'],no:['d-no','niespełniona'],wa:['d-wa','brak danych']};
const PRZ=['Nagłość zdarzenia','Przyczyna zewnętrzna','Uraz','Zwykłe czynności związane z działalnością','Okres ubezpieczenia wypadkowego'];
const RK={UZNAC:['UZNAĆ','b-ok'],NIE:['NIE UZNAĆ','b-no'],DO:['DO UZUPEŁNIENIA','b-wa']};
const PYT=['Jaką dokładnie czynność wykonywałeś w momencie zdarzenia i w ramach jakiego zlecenia?','Co było na podłożu lub w otoczeniu i co wywołało poślizgnięcie?','Która część ciała ucierpiała i czy udzielił Ci już pomocy lekarz lub SOR?'];
const BRAKI=['Opis szczegółowy okoliczności','Karta informacyjna ze szpitala / SOR','Umowa lub zlecenie na usługę'];
const ZAL=['Karta informacyjna ze szpitala / SOR','Umowa lub zlecenie na usługę','Dane świadka (opcjonalnie)'];
const OGOLNIK=/^.{0,54}$/;
let saved=false,step=1,qi=0,nq=0,text='',ans=[],cur='W052',tab=1,loaded=false,own=false,sent=null,dec={},cardOk={};
function role(r){$('#r1').classList.toggle('on',r==1);$('#r2').classList.toggle('on',r==2);r==1?go(step):zus()}
function go(s){step=s;$('#r1').classList.add('on');$('#r2').classList.remove('on');draw()}
function questions(){const ogol=OGOLNIK.test(text.trim())||D.ogolniki.includes(text.trim());return ogol?PYT:[]}
function draw(){const a=$('#app');$('.wrap').classList.remove('wide');
if(step==1)a.innerHTML=`<h1>Opisz, co się stało</h1><div class="calm">Opis nie jest egzaminem — napisz swoimi słowami, co się stało.</div><label for="t">Co się wydarzyło?</label><textarea id="t" placeholder="Napisz swoimi słowami…">${text}</textarea><button class="btn ghost" style="margin-top:8px" onclick="text='Poślizgnąłem się w pracy.';draw()">Wstaw przykład</button><div class="sticky"><button class="btn" onclick="text=$('#t').value;qi=0;ans=[];nq=questions().length;go(nq?2:3)">Dalej</button></div>`;
else if(step==2){const q=questions();a.innerHTML=`<div class="mut">Pytanie ${qi+1} z ${q.length}</div><div class="prog" style="margin:4px 0 10px"><i style="width:${(qi+1)/q.length*100}%"></i></div><div class="words"><small>Twoje słowa</small>${text}</div><div class="q"><small>Pytanie pomocnicze — tylko doprecyzowanie</small><br>${q[qi]}</div><textarea id="an" placeholder="Twoja odpowiedź (możesz pominąć)"></textarea><div class="sticky"><div style="display:flex;gap:8px"><button class="btn sec" onclick="nextq(0)">Pomiń</button><button class="btn" onclick="nextq(1)">Dalej</button></div></div>`}
else if(step==3){const br=brakiNow();a.innerHTML=`<h1>Czy zgłoszenie jest kompletne?</h1><div class="card"><div class="prog"><i style="width:${Math.max(30,100-br.length*15)}%"></i></div><div class="sm mut" style="margin:4px 0">Możesz wysłać w każdej chwili.</div><b>Gotowe:</b> dane firmy, data, godzina, miejsce.<br><b>Brakuje:</b>${br.length?'<ul>'+br.map(b=>'<li>'+b+'</li>').join('')+'</ul>':' nic'}</div><div class="card chk"><h2>Załączniki do dołączenia</h2>${ZAL.map(z=>'<label><input type="checkbox"> '+z+'</label>').join('')}</div><div class="sticky"><button class="btn" onclick="chk()">Wyślij zgłoszenie</button></div>`}
else a.innerHTML=`<h1>✓ Zgłoszenie wysłane</h1><div class="card">Numer sprawy: <b>${sent||NR}</b>. Brakujące dokumenty możesz dosłać później:<ul>${ZAL.slice(0,2).map(z=>'<li>'+z+'</li>').join('')}</ul></div><button class="btn" id="open" onclick="sent=sent||NR;cur='W052';tab=1;zus()">Otwórz tę sprawę jako pracownik ZUS</button>`;scrollTo(0,0)}
function brakiNow(){const full=ans.filter(x=>x&&x.trim()).length>=2||text.trim().length>=55;return full?[ZAL[0]]:BRAKI}
function nextq(ok){ans.push(ok?$('#an').value:'');if(qi<questions().length-1){qi++;draw()}else go(3)}
let nrS=1;
function chk(){const br=brakiNow();if(!br.length){send();return}$('#ml').innerHTML=br.map(b=>'<li>'+b+'</li>').join('');$('#m').classList.add('on')}
const NR='ZG-0001';
function send(){sent=NR;go(4)}
const rkNow=c=>dec[c.id]?dec[c.id].rek:c.rek;
function ctr(){const l=D.cases.filter(c=>loaded&&c.wzorzec);if(!loaded)return own?`<div class="counter"><b>Brak wzorca dla wgranych spraw</b><small>własny plik nie wchodzi do licznika</small></div>`:`<div class="counter"><b>Trafne rekomendacje: 0 z 0 — wgraj pliki</b><small>wgraj 6 spraw testowych, aby zobaczyć licznik</small></div>`;const x=l.filter(c=>c.rek===c.wzorzec).length;return `<div class="counter"><b>Trafne rekomendacje: ${x} z ${l.length}</b><small>paczka pokazowa (6 spraw testowych), kwalifikacja zdarzenia (rekomendacja systemu, nie decyzja człowieka)</small></div>`}
function zus(){$('#r2').classList.add('on');$('#r1').classList.remove('on');draw2()}
function draw2(){const a=$('#app');$('.wrap').classList.add('wide');const c=cs(cur);
a.innerHTML=`${sent?`<div class="stat">Sprawa <b>${sent}</b> z formularza przedsiębiorcy: ${(text||'Poślizgnąłem się w pracy.')} — otwarta jako <b>W052</b> (te same dane, bez przepisywania).</div>`:''}${ctr()}
<div style="margin:6px 0"><button class="btn sec inl" id="upl" onclick="loaded=true;if(!sent)cur='W052';draw2()">Wgraj 6 spraw testowych</button> <button class="btn ghost inl" onclick="own=true;draw2()">Wgraj własny plik</button>${own?'<span class="sm mut"> własny plik: brak wzorca, nie wchodzi do licznika</span>':''}<span>${(loaded?D.cases:[cs('W052')]).map(x=>`<button class="pill ${x.id==cur?'on':''}" onclick="cur='${x.id}';saved=false;draw2()"><span class="badge ${dec[x.id]?RK[dec[x.id].rek][1]:'b-bl'}">${x.id}</span> ${x.kto.split(' ')[1]}</button>`).join('')}</span></div>
<div class="split"><div class="card"><div class="colh">Źródło — zgłoszenie / skan</div>${pScan(c)}</div>
<div class="card"><div class="colh">Ocena — rekomendacja systemu</div><div class="tabs"><button class="${tab==1?'on':''}" onclick="tab=1;draw2()">Rekomendacja i braki</button><button class="${tab==3?'on':''}" onclick="tab=3;draw2()">Projekt karty</button></div>${tab==1?pRek(c)+pUz(c)+pBraki(c)+pDec(c)+pWyl(c)+pPrz(c):pKarta(c)}</div></div>`;scrollTo(0,0)}
function pScan(c){const h=c.skan.replace(/\[\[(.+?)(?:\|(\w+))?\]\]/gs,(m,t,k)=>k?`<span class="unc" data-k="${k}" title="Niepewny odczyt — kliknij, aby poprawić">${t}</span>`:`<span class="hl">${t}</span>`);
return `<div class="scan">${h}</div><div class="sm mut" style="margin-top:6px">${c.unc.length?'Żółte pola: niepewne — sprawdź (pewność odczytu &lt; 70/100); kliknij i popraw. ':''}Niebieskie: cytaty wspierające przesłanki.</div>${c.unc.length?'<button class="btn sec inl" style="margin-top:8px" onclick="recalc(this)">Przelicz</button><span class="sm mut" id="rc"></span>':''}`}
document.addEventListener('click',e=>{const u=e.target.closest('.unc[data-k]');if(u){const v=prompt('Popraw odczytaną wartość:',u.textContent);if(v!==null){u.textContent=v;u.classList.add('fixed')}}});
function recalc(b){b.nextElementSibling.textContent=$$('.unc.fixed').length?' ✓ Przeliczono — rekomendacja bez zmian.':' Najpierw potwierdź lub popraw pola.'}
function pRek(c){const r=RK[c.rek];return `<div class="rek ${c.rek}"><div class="sm mut">Rekomendacja dla sprawy ${c.id} — ${c.kto}</div><div class="v">${r[0]}</div><div class="sm">${dec[c.id]?'Decyzja pracownika: <b>'+RK[dec[c.id].rek][0]+'</b>'+(dec[c.id].powod?' — '+dec[c.id].powod:''):'Rekomendacja — czeka na decyzję pracownika'}</div></div>`}
function pDec(c){return `<div class="dec"><button class="btn ok" onclick="dec['${c.id}']={rek:'${c.rek}',powod:'zatwierdzono'};saved=true;draw2()">Zatwierdź rekomendację</button><button class="btn sec" onclick="dec['${c.id}']={rek:'DO',powod:'odrzucono rekomendację'};saved=true;draw2()">Odrzuć</button></div><div class="dec"><select id="zm"><option value="UZNAC" ${c.rek=='UZNAC'?'selected':''}>UZNAĆ</option><option value="NIE" ${c.rek=='NIE'?'selected':''}>NIE UZNAĆ</option><option value="DO" ${c.rek=='DO'?'selected':''}>DO UZUPEŁNIENIA</option></select><input id="pw" placeholder="Powód zmiany (wymagany)"><button class="btn sec" onclick="zmien('${c.id}')">Zmień na…</button></div>${SV()}`}
function SV(){return `<div class="sv sm ${saved?'':'hide'}">✓ Zapisano — zostanie po odświeżeniu</div>`}
function edit(){saved=true;$$('.sv').forEach(e=>e.classList.remove('hide'))}
function zmien(id){const p=$('#pw').value.trim();if(!p){$('#pw').focus();$('#pw').placeholder='Wpisz powód zmiany!';return}dec[id]={rek:$('#zm').value,powod:p};saved=true;draw2()}
function pUz(c){return `<div class="uz"><b>Uzasadnienie</b><div class="sm">${c.uzas}</div></div>`}
function pWyl(c){return `<div class="excl"><b>Wyłączenia świadczeń — nie mylić z uznaniem</b><div class="sm" style="margin-top:4px">${c.wyl||(c.rek=='DO'?'Nie oceniono — brak danych (wyłączenia ocenia się dopiero po uznaniu zdarzenia).':'Brak.')}</div></div>`}
function pPrz(c){return `<h3>5 przesłanek (art. 3)</h3>`+PRZ.map((p,i)=>`<div class="pr"><span class="dot ${S[c.prz[i]][0]}"></span><div><b>${p}</b> — ${S[c.prz[i]][1]}<br><span class="mut">${c.przn[i]}</span></div></div>`).join('')+`<h3>Podobne sprawy ze zbioru uczącego</h3>${(c.pods||[c.pod]).map(p=>'<div class="sm">'+p+'</div>').join('')}`}
function pBraki(c){return `<h3 style="margin-top:0">Braki i niespójności (${c.braki.length})</h3>`+(c.braki.length?`<ul style="margin:4px 0;padding-left:20px">${c.braki.map(b=>`<li>${b}</li>`).join('')}</ul><div class="sm mut">O co dopytać: ${c.dopytac}</div>`:'<div class="sm mut">Brak braków.</div>')}
function pKarta(c){const f=(l,v,s)=>`<div><label>${l}<span class="src">${s}</span></label><input value="${v}" oninput="edit()"></div>`,ta=(l,v,s)=>`<div style="grid-column:1/-1"><label>${l}<span class="src">${s}</span></label><textarea style="min-height:72px" oninput="edit()">${v}</textarea></div>`;
const kw=c.rek=='UZNAC'?'jest wypadkiem przy pracy':c.rek=='NIE'?'nie jest wypadkiem przy pracy':'do ustalenia po uzupełnieniu dokumentów';
return `<div class="sm mut">Projekt karty wg Dz.U. 2022 poz. 223 (bez pieczątek). Pola edytowalne.</div><h3>I. Płatnik i poszkodowany</h3><div class="kf">${f('Poszkodowany',c.kto,'z EWYP')}${f('Działalność',c.zaw,'z CEIDG')}</div><h3>II. Czas i miejsce</h3><div class="kf">${f('Data',c.data,'z EWYP')}${f('Godzina',c.godz,c.unc.includes('godzina')?'ze skanu — do potwierdzenia':'z EWYP')}${ta('Miejsce',c.miejsce,'z EWYP')}</div><h3>III. Okoliczności</h3><div class="kf">${ta('1. Okoliczności i przyczyny',c.opis,'z wyjaśnień')}${f('2. Rodzaj urazu',c.uraz,c.unc.includes('uraz')?'ze skanu — do potwierdzenia':'z dokumentacji')}${f('4. Kwalifikacja',kw,'rekomendacja — do decyzji człowieka')}${ta('5–6. Wyłączenie świadczeń',c.wyl||'brak','osobno od uznania')}</div><h3>IV. Zapoznanie z kartą</h3><div class="sm mut">Pouczenie o prawie zgłoszenia uwag.</div><button class="btn ok" id="ak" style="margin-top:12px" onclick="this.textContent='✓ Projekt karty zatwierdzony (makieta)';this.disabled=true;edit()">Zatwierdź projekt karty</button>${SV()}`}
const H=location.hash.slice(1);if(H.startsWith("zus")){loaded=true;cur=(H.split("-")[1]||"W052").toUpperCase();if(H.includes("karta"))tab=3;zus()}else draw();
</script></body></html>
