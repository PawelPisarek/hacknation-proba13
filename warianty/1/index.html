<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZANT — wariant 1 — krok po kroku</title><link rel="stylesheet" href="../wspolne/base.css"></head><body>
<div class="top"><div class="row"><b>ZANT · wariant 1</b><div class="seg"><button id="r1" class="on" onclick="role(1)">Przedsiębiorca</button><button id="r2" onclick="role(2)">Pracownik ZUS</button></div></div><div class="loc">Przetwarzanie lokalne — dane nie wychodzą z ZUS (bez zewnętrznego modelu)</div></div>
<div class="wrap" id="app"></div>
<div class="modal" id="m"><div class="box"><h2>Brakuje jeszcze</h2><ul id="ml"></ul><p class="sm mut">Możesz wysłać zgłoszenie teraz — przekażemy tę listę pracownikowi ZUS.</p><button class="btn sec" onclick="$('#m').classList.remove('on')">Wróć i uzupełnij</button><div style="height:8px"></div><button class="btn" onclick="$('#m').classList.remove('on');go(4)">Wysyłam mimo braków</button></div></div>
<div class="demo">Makieta — udawane dane (sztuczny zbiór testowy). Ekran przedsiębiorcy projektowany na telefon.</div>
<script src="../wspolne/data.js"></script>
<script>
let step=1,qi=0,tab=1,cur='W052',text='';const c0=cs('W052');
function role(r){$('#r1').classList.toggle('on',r==1);$('#r2').classList.toggle('on',r==2);if(r==1)go(step>4?1:step);else zus()}
function go(s){step=s;$('#r1').classList.add('on');$('#r2').classList.remove('on');draw()}
function draw(){const a=$('#app');$('.wrap').classList.remove('wide');
if(step==1)a.innerHTML=`<h1>Opisz, co się stało</h1><div class="calm">Opis nie jest egzaminem — napisz swoimi słowami, co dokładnie się wydarzyło.</div><label>Co się wydarzyło?</label><textarea id="t" placeholder="Napisz swoimi słowami…">${text}</textarea><button class="btn ghost" style="margin-top:8px" onclick="text=D.przyklad;draw()">Wstaw przykład (W052)</button><div class="sticky"><button class="btn" onclick="text=$('#t').value;qi=0;go(2)">Dalej</button></div>`;
else if(step==2)a.innerHTML=`<div class="mut">Pytanie ${qi+1} z 3</div><div class="prog" style="margin:4px 0 10px"><i style="width:${(qi+1)*33.3}%"></i></div><div class="words"><small>Twoje słowa</small>${text||'(brak opisu)'}</div><div class="q"><small>Pytanie pomocnicze — tylko doprecyzowanie, bez ocen</small><br>${D.pytania[qi]}</div><textarea placeholder="Twoja odpowiedź (możesz pominąć)"></textarea><div class="sticky"><div style="display:flex;gap:8px"><button class="btn sec" onclick="nq()">Pomiń</button><button class="btn" onclick="nq()">Dalej</button></div></div>`;
else if(step==3)a.innerHTML=`<h1>Czy zgłoszenie jest kompletne?</h1><div class="card"><div class="prog"><i style="width:55%"></i></div><div class="sm mut" style="margin:4px 0">Uzupełniono ok. 55% zgłoszenia — możesz wysłać w każdej chwili.</div><b>Gotowe:</b> dane firmy, data, godzina, miejsce.<br><b>Brakuje:</b><ul>${D.braki.map(b=>'<li>'+b+'</li>').join('')}</ul></div><div class="card chk"><h2>Załączniki do dołączenia</h2>${D.zal.map(z=>'<label><input type="checkbox"> '+z+'</label>').join('')}</div><div class="sticky"><button class="btn" onclick="chk()">Wyślij zgłoszenie</button></div>`;
else a.innerHTML=`<h1>✓ Zgłoszenie wysłane</h1><div class="card">Sprawa <b>W052</b> została zapisana. Brakujące dokumenty możesz dosłać później:<ul>${D.zal.slice(0,2).map(z=>'<li>'+z+'</li>').join('')}</ul></div><button class="btn" onclick="zus()">Otwórz tę sprawę jako pracownik ZUS</button>`;scrollTo(0,0)}
function nq(){if(qi<2){qi++;draw()}else go(3)}
function chk(){$('#ml').innerHTML=D.braki.map(b=>'<li>'+b+'</li>').join('');$('#m').classList.add('on')}
function zus(){$('#r2').classList.add('on');$('#r1').classList.remove('on');draw2()}
function draw2(){const a=$('#app');$('.wrap').classList.add('wide');a.innerHTML=`<div style="max-width:760px;margin:0 auto"><div class="counter"><b>Trafne rekomendacje: 6 z 6</b><small>sztuczny zbiór testowy — zgodność z regułami ZANT (cały zbiór testowy: 13 z 13)</small></div><div style="margin:10px 0"><button class="btn sec inl" onclick="alert('Wgrano 6 spraw testowych (makieta).')">Wgraj 6 spraw testowych</button> ${D.cases.map(c=>`<button class="pill ${c.id==cur?'on':''}" onclick="cur='${c.id}';draw2()"><span class="badge ${RK[c.rek][2]}">${c.id}</span> ${c.kto.split(' ')[1]}</button>`).join('')}</div>
<div class="card"><div class="mut sm">Sprawa ${cur} — ${cs(cur).kto}, ${cs(cur).skrot}</div><div class="tabs" style="margin-top:8px"><button class="${tab==1?'on':''}" onclick="tab=1;draw2()">1. Rekomendacja i braki</button><button class="${tab==2?'on':''}" onclick="tab=2;draw2()">2. Skan i niepewne pola</button><button class="${tab==3?'on':''}" onclick="tab=3;draw2()">3. Projekt karty</button></div>${tab==1?pRek(cs(cur))+pWyl(cs(cur))+pPrz(cs(cur))+pBraki(cs(cur)):tab==2?pScan(cs(cur)):pKarta(cs(cur))}</div></div>`;scrollTo(0,0)}
draw();
</script></body></html>
