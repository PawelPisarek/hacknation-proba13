<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZANT — wariant 2 — lista i kolejka</title><link rel="stylesheet" href="../wspolne/base.css"></head><body>
<div class="top"><div class="row"><b>ZANT · wariant 2</b><div class="seg"><button id="r1" class="on" onclick="role(1)">Przedsiębiorca</button><button id="r2" onclick="role(2)">Kolejka ZUS</button></div></div><div class="loc">Przetwarzanie lokalne — dane nie wychodzą z ZUS (bez zewnętrznego modelu)</div></div>
<div class="wrap" id="app"></div>
<div class="modal" id="m"><div class="box"><h2>Brakuje jeszcze</h2><ul id="ml"></ul><p class="sm mut">Możesz wysłać zgłoszenie teraz — przekażemy tę listę pracownikowi ZUS.</p><button class="btn sec" onclick="$('#m').classList.remove('on')">Wróć</button><div style="height:8px"></div><button class="btn" onclick="$('#m').classList.remove('on');sent=1;draw()">Wysyłam mimo braków</button></div></div>
<div class="demo">Makieta — udawane dane (sztuczny zbiór testowy). Ekran przedsiębiorcy projektowany na telefon.</div>
<script src="../wspolne/data.js"></script>
<script>
let open=1,sent=0,asked=0,filt='ALL',view='q',cur='W052';
const sec=[['Co się stało','okoliczności i przyczyna'],['Kiedy i gdzie','data, godzina, miejsce'],['Uraz i pierwsza pomoc',''],['Dane firmy i poszkodowanego','z przykładu W052'],['Załączniki do dołączenia','karta SOR, umowa/zlecenie, świadek']];
const done=[0,1,0,1,0];
function role(r){$('#r1').classList.toggle('on',r==1);$('#r2').classList.toggle('on',r==2);view=r==1?'e':'q';draw()}
function body(i){const c=cs('W052');
 if(i==0)return `<div class="calm">Opis nie jest egzaminem — napisz swoimi słowami, co dokładnie się wydarzyło.</div><label>Twoje słowa</label><textarea id="t" oninput="done[0]=this.value.length>5?1:0;bar()">${asked?D.przyklad:''}</textarea><button class="btn ghost" style="margin-top:8px" onclick="asked=1;done[0]=1;draw()">Wstaw przykład (W052)</button>${asked?`<div class="q" style="margin-top:10px"><b class="sm">Pomocnicze pytania (to tylko pytania pomocnicze, nie oceny)</b>${D.pytania.map((q,k)=>`<div style="margin:8px 0"><small>${k+1}.</small> ${q}<textarea style="min-height:60px;margin-top:4px" placeholder="Odpowiedź (opcjonalnie)"></textarea></div>`).join('')}</div>`:''}`;
 if(i==1)return `<div class="kf"><div><label>Data</label><input value="${c.data}"></div><div><label>Godzina</label><input value="${c.godz}"></div></div><label>Miejsce</label><input value="${c.miejsce}"><label>Planowane godziny pracy tego dnia</label><input placeholder="np. 8:00–16:00">`;
 if(i==2)return `<label>Rodzaj urazu</label><input value="${c.uraz}"><label>Pierwsza pomoc (tak/nie, gdzie)</label><input placeholder="np. SOR, Lublin">`;
 if(i==3)return `<label>Poszkodowany</label><input value="Rafał Dąbrowski"><label>Działalność (PKD)</label><input value="43.21.Z — wykonywanie instalacji elektrycznych"><label>Adres</label><input value="ul. Kościuszki 94/26, 00-955 Warszawa">`;
 return `<div class="chk">${D.zal.map(z=>`<label><input type="checkbox"> ${z}</label>`).join('')}</div>`}
function bar(){const n=done.reduce((a,b)=>a+b,0);$('#pb').style.width=n*20+'%';$('#pt').textContent=`Uzupełniono ${n} z 5 — możesz wysłać w każdej chwili`}
function draw(){const a=$('#app');$('.wrap').classList.toggle('wide',view!='e');
 if(view=='e'){if(sent){a.innerHTML=`<h1>✓ Zgłoszenie wysłane</h1><div class="card">Sprawa <b>W052</b> zapisana, braki trafiły na listę pracownika ZUS.</div><button class="btn" onclick="role(2)">Przejdź do kolejki pracownika ZUS</button>`;return}
  const n=done.reduce((a,b)=>a+b,0);
  a.innerHTML=`<h1>Zgłoszenie wypadku</h1><div class="calm">Opis nie jest egzaminem. Możesz wysłać zgłoszenie w każdej chwili — resztę dosłasz.</div><div class="card"><div class="prog"><i id="pb" style="width:${n*20}%"></i></div><div class="sm mut" id="pt" style="margin-top:4px">Uzupełniono ${n} z 5 — możesz wysłać w każdej chwili</div></div>`+sec.map((s,i)=>`<div class="card" style="padding:0"><div onclick="open=${open==i?-1:i};draw()" style="display:flex;justify-content:space-between;align-items:center;padding:14px;min-height:52px;cursor:pointer"><div><b>${i+1}. ${s[0]}</b><div class="sm mut">${s[1]}</div></div><span class="badge ${done[i]?'b-ok':'b-wa'}">${done[i]?'gotowe':'brakuje'}</span></div>${open==i?`<div style="padding:0 14px 14px">${body(i)}</div>`:''}</div>`).join('')+`<div class="sticky"><button class="btn" onclick="$('#ml').innerHTML=D.braki.map(b=>'<li>'+b+'</li>').join('');$('#m').classList.add('on')">Wyślij zgłoszenie</button></div>`;return}
 if(view=='d'){const c=cs(cur);a.innerHTML=`<div style="max-width:820px;margin:0 auto"><button class="btn ghost inl" onclick="view='q';draw()">← Wróć do kolejki</button><h1 style="margin-top:10px">Sprawa ${c.id} — ${c.kto}</h1><div class="mut" style="margin-bottom:10px">${c.zaw} · ${c.skrot}</div>${pRek(c)}${pWyl(c)}<div class="card">${pPrz(c)}</div><div class="card">${pBraki(c)}</div><div class="card"><h2>Skan i niepewne pola</h2>${pScan(c)}</div><div class="card"><h2>Projekt karty wypadku</h2>${pKarta(c)}</div></div>`;scrollTo(0,0);return}
 const L=D.cases.filter(c=>filt=='ALL'||c.rek==filt);
 a.innerHTML=`<div style="max-width:820px;margin:0 auto"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:12px"><div class="counter" style="flex:1;min-width:230px"><b>Trafne rekomendacje: 6 z 6</b><small>sztuczny zbiór testowy — zgodność z regułami ZANT (zbiór testowy: 13 z 13)</small></div><button class="btn sec" style="flex:1;min-width:200px" onclick="alert('Wgrano 6 spraw testowych (makieta).')">Wgraj 6 spraw testowych</button></div><div>${[['ALL','Wszystkie'],['UZNAC','Uznać'],['NIE','Nie uznać'],['DO','Do uzupełnienia']].map(f=>`<button class="pill ${filt==f[0]?'on':''}" onclick="filt='${f[0]}';draw()">${f[1]}</button>`).join('')}</div><div class="card" style="padding:4px;overflow-x:auto;margin-top:8px"><table><tr><th>Sprawa</th><th>Rekomendacja</th><th>Wyłączenie świadczeń</th><th>Braki</th><th></th></tr>${L.map(c=>`<tr class="click" onclick="cur='${c.id}';view='d';draw()"><td><b>${c.id}</b>${c.id=='W052'&&sent?' <span class="badge b-bl">Nowe zgłoszenie</span>':''}<br><span class="sm mut">${c.kto}</span></td><td><span class="badge ${RK[c.rek][2]}">${RK[c.rek][0]}</span></td><td class="sm">${c.id=='W038'?'art. 21 ust. 2–3':c.wyl&&c.wyl.startsWith('n/d')?'n/d':'brak'}</td><td>${c.braki.length}</td><td><button class="btn inl sec" style="min-height:38px">Otwórz</button></td></tr>`).join('')}</table></div></div>`}
draw();
</script></body></html>
