<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZANT — wariant 3 — obok siebie</title><link rel="stylesheet" href="../wspolne/base.css">
<style>.cols{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:900px){.cols.d{grid-template-columns:1fr 1fr}.cols.d>div{max-height:calc(100vh - 200px);overflow:auto}.mtabs{display:none}.e .pa,.e .pb{display:block!important}}.e{max-width:430px;margin:0 auto}@media(min-width:900px){.e{max-width:1000px}.e .cols{grid-template-columns:1fr 1fr}}</style></head><body>
<div class="top"><div class="row"><b>ZANT · wariant 3</b><div class="seg"><button id="r1" class="on" onclick="role(1)">Przedsiębiorca</button><button id="r2" onclick="role(2)">Pracownik ZUS</button></div></div><div class="loc">Przetwarzanie lokalne — dane nie wychodzą z ZUS (bez zewnętrznego modelu)</div></div>
<div class="wrap" id="app"></div>
<div class="modal" id="m"><div class="box"><h2>Brakuje jeszcze</h2><ul id="ml"></ul><p class="sm mut">Możesz wysłać zgłoszenie teraz — przekażemy tę listę pracownikowi ZUS.</p><button class="btn sec" onclick="$('#m').classList.remove('on')">Wróć i uzupełnij</button><div style="height:8px"></div><button class="btn" onclick="$('#m').classList.remove('on');sent=1;draw()">Wysyłam mimo braków</button></div></div>
<div class="demo">Makieta — udawane dane (sztuczny zbiór testowy). Ekran przedsiębiorcy projektowany na telefon.</div>
<script src="../wspolne/data.js"></script>
<script>
let view='e',pan=1,sent=0,cur='W052',txt='',ans=0;
function role(r){$('#r1').classList.toggle('on',r==1);$('#r2').classList.toggle('on',r==2);view=r==1?'e':'z';draw()}
function draw(){const a=$('#app'),c=cs('W052');$('.wrap').classList.toggle('wide',true);
 if(view=='e'){if(sent){a.innerHTML=`<div class="e"><h1>✓ Zgłoszenie wysłane</h1><div class="card">Sprawa <b>W052</b> zapisana, braki są na liście pracownika ZUS.</div><button class="btn" onclick="role(2)">Otwórz sprawę w widoku ZUS</button></div>`;return}
  const pct=txt?(ans?60:40):20;
  a.innerHTML=`<div class="e"><div class="calm">Opis nie jest egzaminem — napisz swoimi słowami, co dokładnie się wydarzyło.</div><div class="card"><div class="prog"><i style="width:${pct}%"></i></div><div class="sm mut" style="margin-top:4px">Kompletność zgłoszenia ok. ${pct}% — możesz wysłać w każdej chwili</div></div>
  <div class="tabs mtabs"><button class="${pan==1?'on':''}" onclick="sv();pan=1;draw()">Moje zgłoszenie</button><button class="${pan==2?'on':''}" onclick="sv();pan=2;draw()">Podpowiedzi i braki (3)</button></div>
  <div class="cols"><div class="pa" style="display:${pan==1?'block':'none'}"><div class="card"><h2>Moje zgłoszenie — Twoje słowa</h2><label>Opis zdarzenia</label><textarea id="t" oninput="txt=this.value">${txt}</textarea><button class="btn ghost" style="margin-top:8px" onclick="txt=D.przyklad;draw()">Wstaw przykład (W052)</button><div class="kf"><div><label>Data</label><input value="${c.data}"></div><div><label>Godzina</label><input value="${c.godz}"></div></div><label>Miejsce</label><input value="${c.miejsce}"><label>Uraz</label><input value="${c.uraz}"><label>Firma</label><input value="Rafał Dąbrowski, PKD 43.21.Z"></div></div>
  <div class="pb" style="display:${pan==2?'block':'none'}"><div class="card"><h2>Podpowiedzi i braki</h2><div class="sm mut">Tylko pytania pomocnicze — bez ocen.</div>${D.pytania.map(q=>`<div class="q">${q}<br><button class="btn sec inl" style="min-height:40px;margin-top:6px" onclick="ans=1;txt=(txt||D.przyklad)+' [dopisano odpowiedź]';this.textContent='✓ Dopisano';this.disabled=true">Dopisz odpowiedź do opisu</button></div>`).join('')}<h3>Brakuje w zgłoszeniu</h3><ul>${D.braki.map(b=>'<li>'+b+'</li>').join('')}</ul><h3>Załączniki do dołączenia</h3><div class="chk">${D.zal.map(z=>`<label><input type="checkbox"> ${z}</label>`).join('')}</div></div></div></div>
  <div class="sticky"><button class="btn" onclick="sv();$('#ml').innerHTML=D.braki.map(b=>'<li>'+b+'</li>').join('');$('#m').classList.add('on')">Wyślij zgłoszenie</button></div></div>`;return}
 const k=cs(cur);
 a.innerHTML=`<div class="counter" style="margin-bottom:10px"><b>Trafne rekomendacje: 6 z 6</b><small>sztuczny zbiór testowy — zgodność z regułami ZANT (zbiór testowy: 13 z 13)</small></div><div style="margin-bottom:10px"><button class="btn sec inl" onclick="alert('Wgrano 6 spraw testowych (makieta).')">Wgraj 6 spraw testowych</button> ${D.cases.map(x=>`<button class="pill ${x.id==cur?'on':''}" onclick="cur='${x.id}';draw()"><span class="dot ${x.rek=='UZNAC'?'d-ok':x.rek=='NIE'?'d-no':'d-wa'}" style="flex:0 0 12px;height:12px;margin:0"></span>${x.id}</button>`).join('')}</div>
 <div class="cols d"><div><div class="card"><h2>Źródło — dokument / skan</h2><div class="sm mut" style="margin-bottom:6px">${k.id} — ${k.kto}, ${k.skrot}</div>${pScan(k)}</div></div><div>${pRek(k)}${pWyl(k)}<div class="card">${pPrz(k)}${pBraki(k)}</div><div class="card"><h2>Projekt karty wypadku</h2>${pKarta(k)}</div></div></div>`;scrollTo(0,0)}
function sv(){const t=$('#t');if(t)txt=t.value}
draw();
</script></body></html>
